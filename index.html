<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e54e9);
      position: relative;
    }

    /* Animated background */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 7s infinite alternate ease-in-out;
    }

    body::before {
      background: #ffe259;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #00f2fe;
      bottom: -100px;
      right: -100px;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(80px, 50px);
      }
    }

    /* Birthday card */
    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 600px);
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      animation: cardIn 1.2s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(40px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cake {
      font-size: 75px;
      animation: bounce 2s infinite;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4rem);
      margin-bottom: 15px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .name {
      color: #fff176;
    }

    .message {
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.7;
      margin: 15px auto 25px;
      max-width: 500px;
    }

    .button {
      border: none;
      padding: 15px 28px;
      border-radius: 50px;
      background: linear-gradient(135deg, #fff176, #ffca28);
      color: #7b1fa2;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    .button:active {
      transform: scale(0.95);
    }

    /* Floating balloons */
    .balloon {
      position: absolute;
      font-size: 45px;
      animation: balloonFloat 5s infinite ease-in-out;
      z-index: 1;
    }

    .b1 {
      left: 8%;
      top: 15%;
    }

    .b2 {
      right: 8%;
      top: 20%;
      animation-delay: 1s;
    }

    .b3 {
      left: 15%;
      bottom: 12%;
      animation-delay: 2s;
    }

    .b4 {
      right: 15%;
      bottom: 10%;
      animation-delay: 3s;
    }

    @keyframes balloonFloat {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-25px) rotate(5deg);
      }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 10;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          translateX(var(--x))
          rotate(720deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 60px;
      }

      .message {
        line-height: 1.6;
      }

      .balloon {
        font-size: 32px;
      }

      .b1 {
        left: 3%;
        top: 8%;
      }

      .b2 {
        right: 3%;
        top: 10%;
      }

      .b3 {
        left: 5%;
        bottom: 5%;
      }

      .b4 {
        right: 5%;
        bottom: 5%;
      }
    }
  </style>
</head>

<body>

  <!-- Floating balloons -->
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <!-- Birthday Card -->
  <div class="card">
    <div class="cake">🎂</div>

    <h1>
      Happy Birthday
      <span class="name">crackey!</span> 🎉
    </h1>

    <p class="message">
      Wishing you a day filled with laughter, love, happiness,
      unforgettable memories, and lots of cake! 🥳
      <br><br>
      May all your dreams come true and your year ahead
      be brighter than ever. ✨💖
    </p>

    <button class="button" onclick="celebrate()">
      🎁 Celebrate!
    </button>
  </div>

  <script>
    const colors = [
      "#ff5252",
      "#ffeb3b",
      "#40c4ff",
      "#69f0ae",
      "#e040fb",
      "#ff9800",
      "#ffffff"
    ];

    function createConfetti(amount = 120) {
      for (let i = 0; i < amount; i++) {
        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width = (Math.random() * 8 + 5) + "px";
        confetti.style.height = (Math.random() * 12 + 6) + "px";

        confetti.style.setProperty(
          "--x",
          (Math.random() * 300 - 150) + "px"
        );

        confetti.style.animationDuration =
          (Math.random() * 3 + 3) + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {
      createConfetti(180);
    }

    // Automatic celebration when page opens
    window.addEventListener("load", () => {
      setTimeout(() => {
        createConfetti(150);
      }, 500);
    });
  </script>

</body>
</html>
